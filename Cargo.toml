[package]
name = "clichat"
version = "0.1.0"
edition = "2024"
description = "A terminal-first, end-to-end encrypted peer-to-peer messenger"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
directories = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
fs2 = "0.4"
hex = "0.4"
iroh = "=1.3.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
openmls = "=0.9.1"
openmls_basic_credential = { version = "=0.6.0", features = ["clonable"] }
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
rand = "0.8"
ratatui = "0.30"
rpassword = "7"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
url = { version = "2", features = ["serde"] }
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true
